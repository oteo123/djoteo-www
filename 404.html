<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — OTEO</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    :root{ --ink:#f4f1ea; --gold:#c8a96a; --muted:#a19b8e; --bg:#0a0a0b;
           --sans:"Switzer",system-ui,-apple-system,sans-serif; --serif:'Playfair Display',Georgia,serif; }
    html,body{ margin:0; background:var(--bg); }
    .e404{
      min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      padding:48px 24px; color:var(--ink);
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(200,169,106,.12), transparent 60%),
        radial-gradient(90% 60% at 100% 110%, rgba(200,169,106,.06), transparent 55%),
        var(--bg);
    }
    .e404 .mark{ font:600 19px/1 var(--sans); letter-spacing:.02em; color:var(--ink);
      position:relative; margin-bottom:clamp(28px,5vw,52px); }
    .e404 .mark::after{ content:"·"; color:var(--gold); margin-left:3px; }
    .e404 .code{ font:600 clamp(96px,24vw,240px)/.86 var(--sans); letter-spacing:-.05em;
      color:var(--gold); }
    .e404 h1{ font:600 clamp(24px,4.2vw,44px)/1.08 var(--sans); letter-spacing:-.02em;
      margin:clamp(14px,2vw,22px) 0 0; }
    .e404 h1 em{ font-family:var(--sans); font-style:italic; font-weight:400; color:var(--gold); }
    .e404 p{ color:var(--muted); max-width:46ch; margin:16px auto 0; font:400 16px/1.65 var(--sans); }
    .e404 .cta{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:clamp(30px,5vw,42px); }
    .e404 a.btn{ display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      font:600 13px/1 var(--sans); letter-spacing:.12em; text-transform:uppercase;
      padding:15px 26px; border-radius:999px; transition:transform .25s cubic-bezier(.2,.7,.2,1), background .25s ease, color .25s ease; }
    .e404 a.solid{ background:var(--gold); color:#0a0a0a; border:1.5px solid var(--gold); }
    .e404 a.solid:hover{ background:transparent; color:var(--gold); transform:translateY(-2px); }
    .e404 a.ghost{ color:var(--ink); border:1.5px solid rgba(244,241,234,.28); }
    .e404 a.ghost:hover{ border-color:var(--gold); color:var(--gold); transform:translateY(-2px); }
    @media (prefers-reduced-motion:reduce){ .e404 a.btn{ transition:none; } }
  </style>
  <link rel="stylesheet" href="/assets/oteo-type.css">
</head>
<body>
  <main class="e404">
    <a class="mark" href="/" style="text-decoration:none">OTEO</a>
    <div class="code" aria-hidden="true">404</div>
    <h1>This track isn't in the <em>crate</em>.</h1>
    <p>The page you're after moved or never existed. Let's get you back to the music &mdash; or straight to a booking.</p>
    <div class="cta">
      <a class="btn solid" href="/booking.html#book">Book OTEO <span aria-hidden="true">&#8599;</span></a>
      <a class="btn ghost" href="/">Back home</a>
    </div>
  </main>
</body>
</html>
